<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4b6ef5" />
<meta name="description" content="나주고등학교 3학년 기말고사 시간표 — 반·번호 입력 시 응시 과목만 조회" />
<title>나주고 3학년 기말고사 시간표</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg1:#eef2fb; --bg2:#f6f0fb;
    --card:#ffffff; --line:#e7ebf3; --ink:#1d2230; --muted:#828aa0;
    --accent:#4b6ef5; --accent2:#7a5cf0; --accent-soft:#eaefff;
    --common:#eef1ff; --common-ink:#4257c8;
    --pick:#fff2e0; --pick-ink:#c4790f;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(1200px 600px at 0% -10%, #e3ebff 0%, transparent 55%),
      radial-gradient(1000px 600px at 100% 0%, #f1e6ff 0%, transparent 50%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
    color:var(--ink); min-height:100vh;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased; letter-spacing:-.2px;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:540px; margin:0 auto;
    padding:clamp(18px,5vw,28px) clamp(13px,4vw,16px) 48px;
    padding-left:max(clamp(13px,4vw,16px), env(safe-area-inset-left));
    padding-right:max(clamp(13px,4vw,16px), env(safe-area-inset-right));
  }

  header.top{text-align:center; margin-bottom:20px;}
  header.top .badge{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:.3px;
    color:var(--accent); background:#fff; border:1px solid var(--accent-soft);
    padding:5px 12px; border-radius:999px; box-shadow:0 2px 8px rgba(75,110,245,.10);
  }
  header.top h1{font-size:clamp(20px,5.6vw,24px); margin:12px 0 5px; font-weight:800;}
  header.top p{margin:0; color:var(--muted); font-size:clamp(12.5px,3.4vw,13.5px);}

  /* 반 선택 화면 */
  .selector{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 18px; box-shadow:0 8px 24px rgba(40,55,90,.07);
  }
  .selector .selabel{font-size:14px; font-weight:700; color:#56607a; text-align:center; margin-bottom:14px;}
  .clsgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .clsbtn{
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    padding:18px 0; border-radius:13px; font-size:17px; font-weight:800; color:var(--ink);
    background:linear-gradient(180deg,#fbfcff,#f3f6ff); border:1.5px solid var(--line);
    transition:.13s;
  }
  .clsbtn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px); box-shadow:0 6px 14px rgba(75,110,245,.15);}
  .clsbtn:active{transform:translateY(0);}

  .search{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:0 8px 24px rgba(40,55,90,.07);
  }
  .backrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:13px;}
  .back{font-size:13px; font-weight:700; color:var(--accent); text-decoration:none;}
  .back:hover{text-decoration:underline;}
  .classlabel{font-size:13px; font-weight:800; color:#56607a;}
  .search label{display:block; font-size:13px; font-weight:600; color:#56607a; margin-bottom:9px;}
  .idrow{display:flex; gap:9px; align-items:stretch;}
  .idgroup{
    display:flex; flex:1; min-width:0; border:1.5px solid var(--line); border-radius:12px;
    overflow:hidden; background:#fbfcff; transition:.15s;
  }
  .idgroup:focus-within{border-color:var(--accent); background:#fff; box-shadow:0 0 0 4px var(--accent-soft);}
  .idgroup .prefix{
    display:flex; align-items:center; padding:0 clamp(12px,4vw,16px);
    font-size:clamp(18px,5vw,21px); font-weight:800; color:var(--accent);
    background:var(--accent-soft); border-right:1.5px solid #dbe3ff; letter-spacing:1px; user-select:none;
  }
  .idgroup input{
    flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--ink);
    font-size:clamp(18px,5vw,21px); font-weight:700; letter-spacing:5px; text-align:center; padding:13px 6px;
  }
  .idgroup input::placeholder{font-weight:500; letter-spacing:1px; color:#b6bdcd;}
  .idrow button{
    padding:0 clamp(16px,5vw,22px); font-size:15px; font-weight:700; color:#fff; white-space:nowrap;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:12px;
    cursor:pointer; box-shadow:0 6px 16px rgba(75,110,245,.28); transition:.12s;
  }
  .idrow button:hover{filter:brightness(1.04);}
  .idrow button:active{transform:translateY(1px);}
  .hint{margin-top:10px; font-size:12px; color:var(--muted);}
  .err{margin-top:11px; color:#e0483e; font-size:13px; font-weight:600; display:none;}

  #result{margin-top:20px; display:none; animation:rise .28s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; box-shadow:0 14px 36px rgba(40,55,90,.12);
  }
  .card .chead{
    padding:18px 18px 16px; color:#fff; position:relative;
    background:linear-gradient(135deg,#4b6ef5 0%,#7a5cf0 100%);
  }
  .card .chead .t{font-size:12px; font-weight:600; opacity:.92; letter-spacing:.2px;}
  .card .chead .sid{font-size:clamp(26px,8vw,32px); font-weight:800; letter-spacing:1px; margin-top:3px; line-height:1.1;}
  .card .chead .sum{
    display:inline-block; margin-top:9px; font-size:12px; font-weight:700;
    background:rgba(255,255,255,.18); padding:4px 11px; border-radius:999px;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }

  .legend{
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
    padding:9px 12px; background:#fff; border-bottom:1px solid var(--line);
    font-size:11.5px; color:#6a748c; font-weight:600;
  }
  .legend .lg{display:inline-flex; align-items:center; gap:5px;}
  .legend .dot{width:9px; height:9px; border-radius:3px; display:inline-block;}
  .legend .dot.general{background:#8ca2f3;}
  .legend .dot.career{background:#efb05f;}
  .legend .dot.free{background:#d4d9e3;}

  table{width:100%; border-collapse:collapse; font-size:clamp(12.5px,3.5vw,13.5px);}
  thead th{
    background:#f8fafe; color:#8b93a7; font-weight:700; font-size:11.5px; letter-spacing:.3px;
    padding:9px 6px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:clamp(9px,2.6vw,11px) clamp(4px,1.6vw,6px); border-bottom:1px solid #eef1f6; text-align:center; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .daycell{font-weight:800; white-space:nowrap; background:#fafbff; border-right:1px solid #eef1f6; font-size:14px;}
  .daycell small{display:block; font-weight:500; color:var(--muted); font-size:11px; margin-top:1px;}
  .daycell.d0{box-shadow:inset 4px 0 0 #6e8bf5;}
  .daycell.d1{box-shadow:inset 4px 0 0 #46b387;}
  .daycell.d2{box-shadow:inset 4px 0 0 #e0a23c;}
  .daycell.d3{box-shadow:inset 4px 0 0 #ab78e0;}
  /* 날짜가 바뀌는 지점의 은은한 구분선 (첫 날 제외) */
  tbody tr.day-start:not(:first-child) > td{border-top:2px solid #e4e9f2;}
  .pcell{color:#6a748c; font-size:12px; white-space:nowrap;}
  .timecell{color:#9aa2b6; font-size:11px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .subj{font-weight:700; font-size:clamp(13px,3.6vw,14px);}
  .subj .tag{
    display:inline-block; font-size:10px; font-weight:800; padding:1.5px 7px; border-radius:7px;
    margin-left:6px; vertical-align:middle; letter-spacing:.2px; white-space:nowrap;
  }
  .tag.general{background:var(--common); color:var(--common-ink);}
  .tag.career{background:var(--pick); color:var(--pick-ink);}
  tr.exam td.subj-td{background:linear-gradient(90deg,#f1f5ff,#ffffff); box-shadow:inset 3px 0 0 var(--accent);}
  tr.free td.subj-td .subj{font-weight:500; color:#bcc3d2;}
  tr.free td.subj-td .free-note{font-size:11px; color:#cbd1de; margin-left:2px;}

  .cfoot{
    display:flex; justify-content:center; align-items:center;
    padding:11px 16px; background:#fafbff; border-top:1px solid var(--line);
    font-size:11px; color:var(--muted); text-align:center;
  }

  .actions{display:flex; gap:9px; margin-top:14px;}
  .actions button{
    flex:1; padding:13px 8px; font-size:clamp(13px,3.6vw,14px); font-weight:700; border-radius:12px;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; transition:.12s;
    box-shadow:0 4px 12px rgba(40,55,90,.05);
  }
  .actions button:hover{border-color:#cfd6e6;}
  .actions button.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none;
    box-shadow:0 6px 16px rgba(75,110,245,.28);
  }
  .actions button:active{transform:translateY(1px);}

  .foot{margin-top:18px; text-align:center; font-size:11.5px; color:var(--muted); line-height:1.7;}
  .foot b{color:#6a748c;}
  .foot .src{font-weight:700;}

  @media (max-width:360px){
    .legend{gap:10px;}
    .subj .tag{margin-left:4px;}
  }
  @media print{
    body{background:#fff;}
    .search,.selector,.actions,.foot,header.top .badge,header.top p{display:none !important;}
    .wrap{max-width:none; padding:0;}
    .card{border:none; box-shadow:none;}
    #result{animation:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <span class="badge">2026학년도 1학기 기말고사</span>
      <h1 id="title">📋 나주고 3학년 시험 시간표</h1>
      <p id="subtitle">우리 반을 선택하세요</p>
    </header>

    <!-- 반 선택 화면 -->
    <div class="selector" id="selector" style="display:none">
      <div class="selabel">반을 선택하세요</div>
      <div class="clsgrid">
        <a class="clsbtn" href="?class=1">1반</a>
        <a class="clsbtn" href="?class=2">2반</a>
        <a class="clsbtn" href="?class=3">3반</a>
        <a class="clsbtn" href="?class=4">4반</a>
        <a class="clsbtn" href="?class=5">5반</a>
        <a class="clsbtn" href="?class=6">6반</a>
      </div>
    </div>

    <!-- 조회 화면 (반 선택 후) -->
    <div id="app" style="display:none">
      <div class="search">
        <div class="backrow">
          <a class="back" href="./">← 반 다시 선택</a>
          <span class="classlabel" id="classlabel"></span>
        </div>
        <label for="num">번호 입력</label>
        <div class="idrow">
          <div class="idgroup">
            <span class="prefix" id="prefix">3</span>
            <input id="num" inputmode="numeric" maxlength="2" placeholder="번호" autocomplete="off" aria-label="반 번호" />
          </div>
          <button id="go">조회</button>
        </div>
        <div class="hint" id="hint">우리 반 번호를 입력하세요</div>
        <div class="err" id="err"></div>
      </div>

      <div id="result">
        <div class="card" id="card">
          <div class="chead">
            <div class="t" id="r-head">2026학년도 1학기 기말고사</div>
            <div class="sid" id="r-sid"></div>
            <span class="sum" id="r-sum"></span>
          </div>
          <div class="legend">
            <span class="lg"><i class="dot general"></i>일반선택</span>
            <span class="lg"><i class="dot career"></i>진로선택</span>
            <span class="lg"><i class="dot free"></i>자율학습</span>
          </div>
          <table>
            <thead>
              <tr><th>날짜</th><th>교시</th><th>시간</th><th>과목</th></tr>
            </thead>
            <tbody id="r-body"></tbody>
          </table>
          <div class="cfoot">
            <span>표시되지 않은 시간은 자율학습(시험 없음)</span>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="saveImg">🖼️ 이미지 저장</button>
          <button id="print">🖨️ 인쇄 / PDF</button>
          <button id="reset">↺ 다시</button>
        </div>
      </div>
    </div>

    <div class="foot">
      표시되지 않은 선택과목 시간은 <b>자율학습</b>(시험 없음)입니다.<br />
      <span class="src">출처 · 나주고등학교 3학년실</span>
    </div>
  </div>

  <script src="schedule.js?v=4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const DATA_VER = "1";        // data/cN.js 캐시 버전
    let CLASS = null, CLASS_PREFIX = null, STUDENTS = {};

    // 과목 분류 조회 (띄어쓰기 차이도 허용)
    function categoryOf(name){
      if(typeof CATEGORY === "undefined") return null;
      if(CATEGORY[name]) return CATEGORY[name];
      const norm = name.replace(/\s+/g, "");
      for(const k in CATEGORY){ if(k.replace(/\s+/g,"") === norm) return CATEGORY[k]; }
      return null;
    }

    function decodeRoster(){
      try{
        if(typeof window.ROSTER_ENC === "undefined") return {};
        const bytes = Uint8Array.from(atob(window.ROSTER_ENC), c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder("utf-8").decode(bytes));
      }catch(e){ return {}; }
    }

    // 시작: ?class=N (또는 ?sid=3NKK) 로 반 결정
    function start(){
      const params = new URLSearchParams(location.search);
      let cls = parseInt(params.get("class") || "", 10);
      const psid = params.get("sid");
      if(!(cls >= 1 && cls <= 6) && psid && /^3[1-6]\d\d$/.test(psid)) cls = parseInt(psid[1], 10);

      if(cls >= 1 && cls <= 6){
        const s = document.createElement("script");
        s.src = `data/c${cls}.js?v=${DATA_VER}`;
        s.onload = () => initApp(cls);
        s.onerror = () => { $("subtitle").textContent = "데이터를 불러오지 못했어요. 새로고침 해주세요."; };
        document.head.appendChild(s);
      } else {
        $("selector").style.display = "block";
        $("subtitle").textContent = "우리 반을 선택하세요";
      }
    }

    function initApp(cls){
      CLASS = cls;
      CLASS_PREFIX = "3" + cls;
      STUDENTS = decodeRoster();

      $("title").textContent = `📋 나주고 3학년 ${cls}반 시험 시간표`;
      $("subtitle").textContent = "번호를 입력하면 내 시험만 골라서 보여줘요";
      $("prefix").textContent = CLASS_PREFIX;
      $("classlabel").textContent = `3학년 ${cls}반`;
      $("r-head").textContent = `2026학년도 1학기 기말고사 · 3학년 ${cls}반`;

      const nums = Object.keys(STUDENTS).map(k => parseInt(k.slice(2), 10)).filter(n => !isNaN(n));
      const maxNum = nums.length ? Math.max(...nums) : 0;
      $("hint").textContent = `우리 반 번호를 입력하세요 (1 ~ ${maxNum})`;

      $("app").style.display = "block";

      $("go").addEventListener("click", () => lookup($("num").value));
      $("num").addEventListener("keydown", e => { if(e.key === "Enter") lookup($("num").value); });
      $("num").addEventListener("input", e => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); });
      $("saveImg").addEventListener("click", saveImage);
      $("print").addEventListener("click", () => window.print());
      $("reset").addEventListener("click", () => {
        $("result").style.display = "none";
        $("num").value = ""; $("num").focus();
        window.scrollTo({top:0, behavior:"smooth"});
      });

      // 딥링크: ?num=K 또는 ?sid=3NKK
      const params = new URLSearchParams(location.search);
      let pre = params.get("num");
      const psid = params.get("sid");
      if(!pre && psid && psid.startsWith(CLASS_PREFIX)) pre = String(parseInt(psid.slice(2), 10));
      if(pre){ $("num").value = pre.replace(/[^0-9]/g, ""); lookup($("num").value); }
      else { $("num").focus(); }
    }

    function lookup(numStr){
      const err = $("err");
      err.style.display = "none";
      const n = parseInt((numStr || "").trim(), 10);
      if(!Number.isInteger(n) || n < 1 || n > 99){
        err.textContent = "번호를 입력해 주세요."; err.style.display = "block"; return;
      }
      const sid = CLASS_PREFIX + String(n).padStart(2, "0");
      const taken = STUDENTS[sid];
      if(!taken){
        err.textContent = `${n}번은 우리 반 명단에 없어요.`;
        err.style.display = "block"; $("result").style.display = "none"; return;
      }
      render(sid, n, new Set(taken));
    }

    function render(sid, num, takenSet){
      const body = $("r-body");
      body.innerHTML = "";
      let examCount = 0;

      SCHEDULE.forEach((day, di) => {
        day.periods.forEach((p, idx) => {
          let mySubject = null;
          if(p.type === "common"){
            mySubject = p.subjects[0];
          } else {
            const hit = p.subjects.find(s => takenSet.has(s));
            if(hit){ mySubject = hit; }
          }
          const isExam = mySubject !== null;
          if(isExam) examCount++;

          const tr = document.createElement("tr");
          tr.className = (isExam ? "exam" : "free") + (idx === 0 ? " day-start" : "");

          if(idx === 0){
            const td = document.createElement("td");
            td.className = "daycell d" + di;
            td.rowSpan = day.periods.length;
            td.innerHTML = `${day.date}<small>(${day.dow})</small>`;
            tr.appendChild(td);
          }
          const tdP = document.createElement("td");
          tdP.className = "pcell";
          tdP.textContent = p.no + "교시";
          tr.appendChild(tdP);

          const tdT = document.createElement("td");
          tdT.className = "timecell";
          tdT.textContent = p.time;
          tr.appendChild(tdT);

          const tdS = document.createElement("td");
          tdS.className = "subj-td";
          if(isExam){
            const cat = categoryOf(mySubject);
            const cls = cat === "일반선택" ? "general" : "career";
            const tag = cat ? `<span class="tag ${cls}">${cat}</span>` : "";
            tdS.innerHTML = `<span class="subj">${mySubject}</span>${tag}`;
          } else {
            tdS.innerHTML = `<span class="subj">자율학습</span><span class="free-note">· 시험 없음</span>`;
          }
          tr.appendChild(tdS);
          body.appendChild(tr);
        });
      });

      $("r-sid").textContent = `3학년 ${CLASS}반 ${num}번`;
      $("r-sum").textContent = `학번 ${sid} · 응시 과목 총 ${examCount}개`;
      $("result").style.display = "block";
      $("result").scrollIntoView({behavior:"smooth", block:"start"});
    }

    function saveImage(){
      const card = $("card");
      if(typeof html2canvas !== "function"){
        alert("이미지 저장 기능을 불러오지 못했어요.\n'인쇄 / PDF'를 이용하거나 화면을 캡처해 주세요.");
        return;
      }
      html2canvas(card, {scale:2, backgroundColor:"#ffffff", useCORS:true}).then(canvas => {
        const link = document.createElement("a");
        link.download = `기말고사_3-${CLASS}_${$("num").value || ""}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      }).catch(() => {
        alert("이미지 저장에 실패했어요. '인쇄 / PDF'를 이용해 주세요.");
      });
    }

    start();
  </script>
</body>
</html>

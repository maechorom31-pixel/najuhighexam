<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>나주고 3학년 기말고사 시간표 조회</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg1:#eef2fb; --bg2:#f6f0fb;
    --card:#ffffff; --line:#e7ebf3; --ink:#1d2230; --muted:#828aa0;
    --accent:#4b6ef5; --accent2:#7a5cf0; --accent-soft:#eaefff;
    --exam:#fff8ec; --exam-bar:#f6a93b;
    --common:#eef1ff; --common-ink:#4257c8;
    --pick:#fff2e0; --pick-ink:#c4790f;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(1200px 600px at 0% -10%, #e3ebff 0%, transparent 55%),
      radial-gradient(1000px 600px at 100% 0%, #f1e6ff 0%, transparent 50%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
    color:var(--ink); min-height:100vh;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased; letter-spacing:-.2px;
  }
  .wrap{max-width:540px; margin:0 auto; padding:28px 16px 48px;}

  header.top{text-align:center; margin-bottom:20px;}
  header.top .badge{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:.3px;
    color:var(--accent); background:#fff; border:1px solid var(--accent-soft);
    padding:5px 12px; border-radius:999px; box-shadow:0 2px 8px rgba(75,110,245,.10);
  }
  header.top h1{font-size:23px; margin:12px 0 5px; font-weight:800;}
  header.top p{margin:0; color:var(--muted); font-size:13.5px;}

  .search{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:0 8px 24px rgba(40,55,90,.07);
  }
  .search label{display:block; font-size:13px; font-weight:600; color:#56607a; margin-bottom:9px;}
  .row{display:flex; gap:9px;}
  .row input{
    flex:1; width:100%; font-size:20px; font-weight:700; letter-spacing:4px; text-align:center;
    padding:13px 10px; border:1.5px solid var(--line); border-radius:12px;
    outline:none; background:#fbfcff; color:var(--ink); transition:.15s;
  }
  .row input::placeholder{font-weight:500; letter-spacing:2px; color:#b6bdcd;}
  .row input:focus{border-color:var(--accent); background:#fff; box-shadow:0 0 0 4px var(--accent-soft);}
  .row button{
    padding:0 20px; font-size:15px; font-weight:700; color:#fff; white-space:nowrap;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:12px;
    cursor:pointer; box-shadow:0 6px 16px rgba(75,110,245,.28); transition:.12s;
  }
  .row button:hover{filter:brightness(1.04);}
  .row button:active{transform:translateY(1px);}
  .hint{margin-top:10px; font-size:12px; color:var(--muted);}
  .err{margin-top:11px; color:#e0483e; font-size:13px; font-weight:600; display:none;}

  /* 결과 카드 (이미지/인쇄 대상) */
  #result{margin-top:20px; display:none; animation:rise .28s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; box-shadow:0 14px 36px rgba(40,55,90,.12);
  }
  .card .chead{
    padding:18px 18px 16px; color:#fff; position:relative;
    background:linear-gradient(135deg,#4b6ef5 0%,#7a5cf0 100%);
  }
  .card .chead .t{font-size:12px; font-weight:600; opacity:.92; letter-spacing:.2px;}
  .card .chead .sid{font-size:30px; font-weight:800; letter-spacing:1px; margin-top:3px; line-height:1.1;}
  .card .chead .sum{
    display:inline-block; margin-top:9px; font-size:12px; font-weight:700;
    background:rgba(255,255,255,.18); padding:4px 11px; border-radius:999px;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    background:#f8fafe; color:#8b93a7; font-weight:700; font-size:11.5px; letter-spacing:.3px;
    padding:9px 6px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:11px 6px; border-bottom:1px solid #eef1f6; text-align:center; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .daycell{font-weight:800; white-space:nowrap; background:#fafbff; border-right:1px solid #eef1f6; font-size:14px;}
  .daycell small{display:block; font-weight:500; color:var(--muted); font-size:11px; margin-top:1px;}
  .pcell{color:#6a748c; font-size:12px; white-space:nowrap;}
  .timecell{color:#9aa2b6; font-size:11px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .subj{font-weight:700; font-size:14px;}
  .subj .tag{
    display:inline-block; font-size:10px; font-weight:800; padding:1.5px 7px; border-radius:7px;
    margin-left:6px; vertical-align:middle; letter-spacing:.2px;
  }
  .tag.general{background:var(--common); color:var(--common-ink);}
  .tag.career{background:var(--pick); color:var(--pick-ink);}
  tr.exam td.subj-td{background:linear-gradient(90deg,var(--exam),#fffdf9); box-shadow:inset 3px 0 0 var(--exam-bar);}
  tr.free td.subj-td .subj{font-weight:500; color:#bcc3d2;}
  tr.free td.subj-td .free-note{font-size:11px; color:#cbd1de; margin-left:2px;}

  .cfoot{
    display:flex; justify-content:center; align-items:center;
    padding:11px 16px; background:#fafbff; border-top:1px solid var(--line);
    font-size:11px; color:var(--muted);
  }

  .actions{display:flex; gap:9px; margin-top:14px;}
  .actions button{
    flex:1; padding:13px; font-size:14px; font-weight:700; border-radius:12px;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; transition:.12s;
    box-shadow:0 4px 12px rgba(40,55,90,.05);
  }
  .actions button:hover{border-color:#cfd6e6;}
  .actions button.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none;
    box-shadow:0 6px 16px rgba(75,110,245,.28);
  }
  .actions button:active{transform:translateY(1px);}

  .foot{margin-top:18px; text-align:center; font-size:11.5px; color:var(--muted); line-height:1.7;}
  .foot b{color:#6a748c;}
  .foot .src{font-weight:700;}

  @media print{
    body{background:#fff;}
    .search,.actions,.foot,header.top .badge,header.top p{display:none !important;}
    .wrap{max-width:none; padding:0;}
    .card{border:none; box-shadow:none;}
    #result{animation:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <span class="badge">2026학년도 1학기 기말고사</span>
      <h1>📋 나주고 3학년 시험 시간표</h1>
      <p>학번을 입력하면 내 시험만 골라서 보여줘요</p>
    </header>

    <div class="search">
      <label for="sid">학번 입력</label>
      <div class="row">
        <input id="sid" inputmode="numeric" maxlength="4" placeholder="3201" autocomplete="off" aria-label="학번 4자리" />
        <button id="go">조회</button>
      </div>
      <div class="hint">3학년 학번 4자리를 입력하세요 (예: 3201, 3614)</div>
      <div class="err" id="err"></div>
    </div>

    <div id="result">
      <div class="card" id="card">
        <div class="chead">
          <div class="t">2026학년도 1학기 기말고사 · 3학년</div>
          <div class="sid" id="r-sid"></div>
          <span class="sum" id="r-sum"></span>
        </div>
        <table>
          <thead>
            <tr><th>날짜</th><th>교시</th><th>시간</th><th>과목</th></tr>
          </thead>
          <tbody id="r-body"></tbody>
        </table>
        <div class="cfoot">
          <span>표시되지 않은 시간은 자율학습(시험 없음)</span>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="saveImg">🖼️ 이미지 저장</button>
        <button id="print">🖨️ 인쇄 / PDF</button>
        <button id="reset">↺ 다시</button>
      </div>
    </div>

    <div class="foot">
      표시되지 않은 선택과목 시간은 <b>자율학습</b>(시험 없음)입니다.<br />
      <span class="src">출처 · 나주고등학교 3학년실</span>
    </div>
  </div>

  <script src="schedule.js"></script>
  <script src="students.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function lookup(sid){
      const err = $("err");
      err.style.display = "none";
      sid = (sid||"").trim();
      if(!/^\d{4}$/.test(sid)){
        err.textContent = "학번 4자리를 정확히 입력하세요.";
        err.style.display = "block";
        return;
      }
      const taken = STUDENTS[sid];
      if(!taken){
        err.textContent = "해당 학번을 찾을 수 없습니다. (3학년 학번인지 확인하세요)";
        err.style.display = "block";
        $("result").style.display = "none";
        return;
      }
      render(sid, new Set(taken));
    }

    function render(sid, takenSet){
      const body = $("r-body");
      body.innerHTML = "";
      let examCount = 0;

      SCHEDULE.forEach(day => {
        day.periods.forEach((p, idx) => {
          let mySubject = null;
          if(p.type === "common"){
            mySubject = p.subjects[0];
          } else {
            const hit = p.subjects.find(s => takenSet.has(s));
            if(hit){ mySubject = hit; }
          }
          const isExam = mySubject !== null;
          if(isExam) examCount++;

          const tr = document.createElement("tr");
          tr.className = isExam ? "exam" : "free";

          if(idx === 0){
            const td = document.createElement("td");
            td.className = "daycell";
            td.rowSpan = day.periods.length;
            td.innerHTML = `${day.date}<small>(${day.dow})</small>`;
            tr.appendChild(td);
          }
          const tdP = document.createElement("td");
          tdP.className = "pcell";
          tdP.textContent = p.no + "교시";
          tr.appendChild(tdP);

          const tdT = document.createElement("td");
          tdT.className = "timecell";
          tdT.textContent = p.time;
          tr.appendChild(tdT);

          const tdS = document.createElement("td");
          tdS.className = "subj-td";
          if(isExam){
            const cat = (typeof CATEGORY !== "undefined" && CATEGORY[mySubject]) || "선택";
            const cls = cat === "일반선택" ? "general" : "career";
            const tag = `<span class="tag ${cls}">${cat}</span>`;
            tdS.innerHTML = `<span class="subj">${mySubject}</span>${tag}`;
          } else {
            tdS.innerHTML = `<span class="subj">자율학습</span><span class="free-note">· 시험 없음</span>`;
          }
          tr.appendChild(tdS);
          body.appendChild(tr);
        });
      });

      $("r-sid").textContent = sid;
      $("r-sum").textContent = `📝 응시 과목 총 ${examCount}개`;
      $("result").style.display = "block";
      $("result").scrollIntoView({behavior:"smooth", block:"start"});
    }

    function saveImage(){
      const card = $("card");
      if(typeof html2canvas !== "function"){
        alert("이미지 저장 라이브러리를 불러오지 못했습니다.\n'인쇄 / PDF'를 이용하거나 화면을 캡처해 주세요.");
        return;
      }
      html2canvas(card, {scale:2, backgroundColor:"#ffffff", useCORS:true}).then(canvas => {
        const link = document.createElement("a");
        link.download = `기말고사_${$("r-sid").textContent}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      }).catch(() => {
        alert("이미지 저장에 실패했습니다. '인쇄 / PDF'를 이용해 주세요.");
      });
    }

    $("go").addEventListener("click", () => lookup($("sid").value));
    $("sid").addEventListener("keydown", e => { if(e.key === "Enter") lookup($("sid").value); });
    $("sid").addEventListener("input", e => { e.target.value = e.target.value.replace(/[^0-9]/g,""); });
    $("saveImg").addEventListener("click", saveImage);
    $("print").addEventListener("click", () => window.print());
    $("reset").addEventListener("click", () => {
      $("result").style.display = "none";
      $("sid").value = "";
      $("sid").focus();
      window.scrollTo({top:0, behavior:"smooth"});
    });

    const q = new URLSearchParams(location.search).get("sid");
    if(q){ $("sid").value = q; lookup(q); }
  </script>
</body>
</html>
